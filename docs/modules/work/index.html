<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作计划 · 界面演示</title>
  <link rel="stylesheet" href="css/work.css?v=blog-demo-v1">
  <link rel="stylesheet" href="css/common.css?v=blog-demo-v1">
</head>
<body class="wb-body">
  <div class="wb-shell">
    <header class="wb-top">
      <div class="wb-brand">
        <h1>Workbench</h1>
        <span class="wb-badge">界面演示 · 功能待接入</span>
      </div>
      <div class="wb-top-right">
        <span id="wbUserLabel">-</span>
        <a href="/" target="_parent">功能入口</a>
        <a href="/pages/modules/agent" target="_parent">返回 Agent</a>
        <button type="button" class="wb-btn ghost" id="btnWbLogout">返回门户</button>
      </div>
    </header>
    <div class="wb-main">
      <nav class="wb-nav" id="wbNav">
        <button type="button" data-view="home" class="active">总览</button>
        <button type="button" data-view="focus">我的待办</button>
        <button type="button" data-view="plans">任务列表</button>
        <button type="button" data-view="board">看板</button>
        <button type="button" data-view="daily">每日记录</button>
        <button type="button" data-view="weekly">周报</button>
        <button type="button" data-view="monthly">月度总结</button>
        <button type="button" data-view="gantt">甘特图</button>
        <button type="button" data-view="handover">交接沉淀</button>
        <button type="button" data-view="review" id="navReview" style="display:none;">审核中心</button>
      </nav>
      <main class="wb-content" id="wbContent"></main>
    </div>
  </div>
  <script src="js/config.js?v=blog-demo-v1"></script>
  <script src="js/auth.js?v=blog-demo-v1"></script>
  <script src="js/api-demo.js?v=blog-demo-v1"></script>
  <script src="js/user-picker.js?v=blog-demo-v1"></script>
  <script src="js/work.js?v=blog-demo-v1"></script>
  <script>
    (function () {
      var u = window.__DEMO_USER__ || {
        id: 1, username: 'demo', role: 'super', role_label: '超级管理员',
        permissions: ['all']
      };
      try { Auth.setSession('blog-demo-token', u); } catch (e) {}
      Auth.requireLogin = function () { return true; };
      var label = document.getElementById('wbUserLabel');
      if (label) label.textContent = u.username + ' · ' + (u.role_label || u.role);
      var btn = document.getElementById('btnWbLogout');
      if (btn) {
        btn.onclick = function () {
          try { Auth.clearSession(); } catch (e) {}
          if (window.parent && window.parent !== window) window.parent.location.href = '/';
          else location.href = '/';
        };
      }
    })();
  </script>
</body>
</html>
