<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I2C 时序动画</title>
  <link rel="stylesheet" href="assets/common.css?v=3" />
</head>
<body>
  <header class="topbar">
    <strong>I2C 时序</strong>
    <nav>
      <a href="index.html">演示索引</a>
      <a href="/pages/blog/2026-10-20-I2C总线.html">博客文章</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="hero">
      <h1>I2C 时序动画</h1>
      <p class="lead">Start + 写地址 0xA0 + ACK + Stop。点击波形暂停。</p>
    </div>
    <section>
      <div class="wave-box">
        <canvas></canvas>
        <script type="application/json" class="wave-spec">
        {
          "title": "Start + 0xA0 + ACK + Stop",
          "labels": ["SCL", "SDA"],
          "waves": ["11010101010101010101011", "10110011000000000000001"],
          "markers": [{"at": 1, "text": "S"}, {"at": 18, "text": "ACK"}, {"at": 21, "text": "P"}],
          "stepMs": 260
        }
        </script>
        <p class="wave-cap">S：SCL 高时 SDA 下降。P：SCL 高时 SDA 上升。ACK 槽 SDA 为低表示从机应答。</p>
      </div>
    </section>
  </main>
  <script src="assets/common.js?v=3"></script>
  <script src="assets/embed.js?v=3"></script>
</body>
</html>
